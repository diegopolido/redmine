# Kamal 2 deploy configuration for Redmine 7.0.
# Run everything through bin/kamal (version pinned in Gemfile.local).
#
# The server runs several apps sharing one kamal-proxy. Global proxy settings
# (`kamal proxy boot_config`, proxy reboot/upgrade) are managed from the
# infrastructure repo, never from here.

service: redmine
image: diegopolido/redmine # => ghcr.io/diegopolido/redmine

# The only value to fill in on migration day (also used by the db accessory
# below through the YAML alias).
x-vps-ip: &vps_ip "<<IP_DA_VPS>>"

servers:
  web:
    hosts:
      - *vps_ip

proxy:
  ssl: true
  host: redmine.polidosantana.com.br
  app_port: 3000
  # Large attachments upload through the proxy.
  buffering:
    max_request_body: 0
  response_timeout: 60
  healthcheck:
    # Redmine has no /up endpoint; /login always answers 200 and touches
    # the database (settings), so it is a meaningful check.
    path: /login
    interval: 3
    timeout: 5

registry:
  server: ghcr.io
  username: diegopolido
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64 # Hostinger KVM VPS are x86_64

env:
  clear:
    RAILS_MAX_THREADS: 3
    WEB_CONCURRENCY: 1 # Puma single mode: one process, few threads
    REDMINE_DB_HOST: redmine-db # container name of the `db` accessory
    REDMINE_DB_PORT: 5432
    REDMINE_DB_DATABASE: redmine
    REDMINE_DB_USERNAME: redmine
    REDMINE_ATTACHMENTS_PATH: /rails/files
    # Outgoing e-mail via Brevo. SMTP_ADDRESS/PORT/USERNAME/PASSWORD and
    # MAILER_FROM come from .env.production (same names as the other apps);
    # leave SMTP_ADDRESS empty there to disable delivery.
    SMTP_ENABLE_STARTTLS: "true"
    SMTP_TLS: "false"
    SMTP_AUTHENTICATION: login
    SMTP_DOMAIN: polidosantana.com.br # HELO domain
  secret:
    - SECRET_KEY_BASE
    - REDMINE_DB_PASSWORD
    - SMTP_ADDRESS
    - SMTP_PORT
    - SMTP_USERNAME
    - SMTP_PASSWORD
    - MAILER_FROM

volumes:
  - "redmine_files:/rails/files"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: accessory exec db --interactive --reuse "psql -U redmine redmine"

accessories:
  # The app's OWN PostgreSQL (one per app on this server), so Redmine can be
  # moved alone to another server: change the IP, `bin/kamal setup`, restore.
  # Container `redmine-db` on the `kamal` network; no host port is published.
  db:
    image: postgres:18
    host: *vps_ip
    env:
      clear:
        POSTGRES_DB: redmine
        POSTGRES_USER: redmine
      secret:
        - POSTGRES_PASSWORD
    # Postgres 18 images keep PGDATA under /var/lib/postgresql/18/docker:
    # mount the parent directory.
    volumes:
      - "redmine_pgdata:/var/lib/postgresql"
    options:
      memory: 512m       # hard limit — the VPS is shared with other apps
      shm-size: 128m
    # Tuning sized for the 512 MB limit and a single Puma process (3 threads).
    cmd: >-
      postgres
      -c max_connections=20
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c wal_buffers=4MB
      -c max_wal_size=512MB
      -c max_parallel_workers_per_gather=1
      -c max_worker_processes=4
